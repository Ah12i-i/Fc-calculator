<!-- Purpose: main single-page FC coins calculator markup with Arabic content and social footer. -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1030" />
    <title>حاسبة الكوينز | FC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="assets/images/fc-coins-small.png" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="js/config.js" defer></script>
    <script src="js/calculator.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand" aria-label="اسم الموقع">
          <img class="brand-logo" src="assets/images/fc-coins-small.png" alt="FC Coins" width="54" height="54" loading="eager" />
          <div class="brand-copy">
            <h1 class="brand-name">حاسبة الكوينز</h1>
            <p class="brand-subtitle">احسب ربحك بعد ضريبة 5%</p>
          </div>
        </div>
      </header>

      <main class="calculator-wrap">
        <section class="card panel form-panel" aria-label="نموذج الحساب">
          <h2 class="section-title">إدخالات الحساب</h2>

          <div class="field">
            <label for="buy-price">سعر الشراء (للاعب الواحد)</label>
            <div class="input-wrap">
              <input id="buy-price" type="text" inputmode="numeric" placeholder="0" aria-label="سعر الشراء" />
            </div>
          </div>

          <div class="field">
            <label for="sell-price">سعر البيع (للاعب الواحد)</label>
            <div class="input-wrap">
              <input id="sell-price" type="text" inputmode="numeric" placeholder="0" aria-label="سعر البيع" />
            </div>
          </div>

          <div class="field">
            <label for="players-count">عدد اللاعبين من نفس النسخة</label>
            <div class="player-control">
              <button type="button" class="player-stepper" data-step="-1" aria-label="إنقاص">−</button>
              <div class="input-wrap player-input">
                <input id="players-count" type="text" inputmode="numeric" value="1" aria-label="عدد اللاعبين" />
              </div>
              <button type="button" class="player-stepper" data-step="1" aria-label="زيادة">+</button>
            </div>
            <div class="chip-row" aria-label="اختيارات سريعة">
              <button type="button" class="chip is-active" data-players="1">1</button>
              <button type="button" class="chip" data-players="5">5</button>
              <button type="button" class="chip" data-players="10">10</button>
              <button type="button" class="chip" data-players="25">25</button>
            </div>
          </div>

          <button type="button" id="reset-btn" class="reset-btn">إعادة تعيين</button>
        </section>

        <section class="card panel results-panel" aria-label="نتائج الحساب">
          <div class="results-grid">
            <article class="result-card profit neutral-card" id="profit-card" aria-live="polite">
              <div class="result-top">
                <h3 class="result-title">صافي الربح</h3>
                <span class="status-pill" aria-hidden="true"></span>
              </div>

              <div class="amount-wrap">
                <img class="coin-icon" src="assets/images/fc-coins-small.png" alt="كوينة" width="22" height="22" loading="eager" />
                <span id="profit-total">0</span>
              </div>

              <div class="stat-list">
                <div class="stat-row">
                  <span class="stat-label">الربح للنسخة الواحدة بعد الضريبة</span>
                  <span class="stat-value">
                    <img class="coin-icon small" src="assets/images/fc-coins-small.png" alt="" width="16" height="16" loading="eager" />
                    <span id="profit-per-player">0</span>
                  </span>
                </div>

                <div class="stat-row">
                  <span class="stat-label">نسبة الربح</span>
                  <span class="stat-value percent-value" dir="ltr">
                    <span id="profit-percent">+0.00%</span>
                  </span>
                </div>
              </div>

              <div class="break-even">
                <span class="break-even-label">أقل سعر للخروج بدون خسارة</span>
                <div class="break-even-value">
                  <img class="coin-icon small" src="assets/images/fc-coins-small.png" alt="" width="16" height="16" loading="eager" />
                  <span id="break-even-profit">0</span>
                </div>
              </div>
            </article>

            <article class="result-card loss neutral-card" id="loss-card" aria-live="polite">
              <div class="result-top">
                <h3 class="result-title">صافي الربح</h3>
                <span class="status-pill" aria-hidden="true"></span>
              </div>

              <div class="amount-wrap">
                <img class="coin-icon" src="assets/images/fc-coins-small.png" alt="كوينة" width="22" height="22" loading="eager" />
                <span id="loss-total">0</span>
              </div>

              <div class="stat-list">
                <div class="stat-row">
                  <span class="stat-label">الخسارة للنسخة الواحدة بعد الضريبة</span>
                  <span class="stat-value">
                    <img class="coin-icon small" src="assets/images/fc-coins-small.png" alt="" width="16" height="16" loading="eager" />
                    <span id="loss-per-player">0</span>
                  </span>
                </div>

                <div class="stat-row">
                  <span class="stat-label">نسبة الربح</span>
                  <span class="stat-value percent-value" dir="ltr">
                    <span id="loss-percent">+0.00%</span>
                  </span>
                </div>
              </div>

              <div class="break-even">
                <span class="break-even-label">أقل سعر للخروج بدون خسارة</span>
                <div class="break-even-value">
                  <img class="coin-icon small" src="assets/images/fc-coins-small.png" alt="" width="16" height="16" loading="eager" />
                  <span id="break-even-loss">0</span>
                </div>
              </div>
            </article>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p class="footer-copy">تابعني على تويتر</p>
        <a class="social-link" href="https://x.com/qii96_" target="_blank" rel="noopener noreferrer" aria-label="X @qii96_">
          <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.9 2h3.52l-7.68 8.78L22.4 22h-6.94l-5.43-7.94L4.3 22H.78l8.22-9.39L1.6 2h7.1l4.9 7.2L18.9 2Zm-1.24 18h1.95L7.1 3.9H5.08L17.66 20Z"/>
          </svg>
          <span>_qii96@</span>
        </a>
      </footer>
    </div>
  </body>
</html>
